[package]
name = "symbolica_jl"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
symbolica = { path = "../deps/symbolica" }
# `#[julia]` proc-macro from RustCall.jl. `deps/build.jl` links the installed
# RustCall package's copy to deps/juliacall_macros before building.
juliacall_macros = { path = "../deps/juliacall_macros" }
